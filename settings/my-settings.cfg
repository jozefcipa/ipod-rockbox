# Personal Rockbox settings. Only the lines below change, everything else stays as is.
# Load on the iPod: Settings > Manage Settings > Browse .cfg Files > my-settings.cfg

# Click wheel sound from the built-in speaker, on every wheel step
hardware keyclick: on
keyclick repeats: on
keyclick: off

# Main menu: default order without files, recording and shortcuts. Must keep "settings" or the menu is unreachable.
root menu order: bookmarks,database,wps,settings,playlists,plugins,system_menu

# Battery size, so the remaining-time estimate is right (iFlash + bigger battery)
battery capacity: 2000
