# CFG File
#
wps: /.rockbox/wps/Classic Revival.wps
sbs: /.rockbox/wps/Classic Revival.sbs
fms: /.rockbox/wps/Classic Revival.fms
backdrop: /.rockbox/backdrops/ClassicRevival_bd.bmp
background color: FFFFFF
filetype colours: -
font: /.rockbox/fonts/17-NimbusSans-Bold.fnt
foreground color: 000000
iconset: -
line selector end color: 186DBD
line selector start color: 6BA6DE
line selector text color: FFFFFF
scrollbar: off
selector type: bar (gradient)
# "show icons: on" is required: the menu skin uses each item's icon number to
# decide where to draw the ">" chevron. The icons themselves are never drawn.
show icons: on
statusbar: off
ui viewport: -
viewers iconset: -